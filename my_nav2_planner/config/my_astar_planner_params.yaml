# My A* Planner 配置参数
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    
    GridBased:
      plugin: "my_nav2_planner/MyAStarPlanner"
      
      # 邻域设置
      use_8_neighbors: true          # true=8邻域(对角线), false=4邻域
      
      # 代价权重
      cost_weight: 0.5               # 代价地图权重 [0.0-1.0], 越大越远离障碍物
      
      # 超时设置
      timeout_ms: 5000.0             # 规划超时时间(毫秒)
      
      # 路径平滑
      smooth_path: true              # 是否启用路径平滑
      smoothing_iterations: 50       # 平滑迭代次数
      smoothing_weight: 0.3          # 平滑权重 [0.0-1.0]
      
      # 可视化
      publish_visualization: true    # 是否发布可视化标记

